[alembic]
script_location = migrations
file_template = %%(year)d_%%(month)02d_%%(day)02d_%%(hour)02d_%%(minute)02d_%%(second)02d_%%(slug)s
version_path_separator = os
version_locations = %(script_location)s/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic
encoding = utf-8

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[alembic:exclude]
tables = alembic_version
