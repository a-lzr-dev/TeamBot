# ============================================================
# Docker Compose Override для разработки
# ============================================================
# Использование: docker-compose -f docker-compose.yml -f docker-compose.override.yml up
# ============================================================

services:
  app:
    environment:
      APP_ENV: development
      APP_DEBUG: true
      LOG_LEVEL: DEBUG
      API_RELOAD: true
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./temp:/app/temp
    ports:
      - "8000:8000"
      - "5678:5678"
    command: ["--mode", "dev"]

