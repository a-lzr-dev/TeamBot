  # ============ Nginx (опционально) ============
  nginx:
    image: nginx:alpine
    container_name: teambot_nginx
    restart: unless-stopped
    profiles:
      - production
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./static:/static:ro
      # ЗАКРЫТУЮ папку ./update/apk в nginx НЕ монтируем —
      # её отдаёт только FastAPI с проверкой settings.API_KEY_HEADER.
      # ОТКРЫТАЯ папка: раздаётся как /static/update/public/...
      - ./update/public:/apk-public:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - teambot_network

networks:
  teambot_network:
    driver: bridge
