services:
  # ============ Приложение (использует внешнюю БД) ============
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: teambot:latest
    container_name: teambot_app
    restart: unless-stopped
    environment:
      # ----------------------------------------------------------
      # Все значения — из .env / .env.docker.
      # Для критичных полей используется `:?` — compose падает
      # с осмысленной ошибкой, если переменная не задана.
      # ----------------------------------------------------------

      # ---------- PostgreSQL (основная БД) ----------
      DB_MAIN_NAME: ${DB_MAIN_NAME}
      DB_MAIN_USER: ${DB_MAIN_USER:?set DB_MAIN_USER in .env}
      DB_MAIN_PASSWORD: ${DB_MAIN_PASSWORD:?set DB_MAIN_PASSWORD in .env}
      DB_MAIN_HOST: ${DB_MAIN_HOST}
      DB_MAIN_PORT: ${DB_MAIN_PORT}
      DB_MAIN_POOL_SIZE: ${DB_MAIN_POOL_SIZE}
      DB_MAIN_MAX_OVERFLOW: ${DB_MAIN_MAX_OVERFLOW}
      DB_MAIN_ECHO: ${DB_MAIN_ECHO}

      # ---------- MSSQL (Avanpost) ----------
      DB_AVANPOST_NAME: ${DB_AVANPOST_NAME}
      DB_AVANPOST_USER: ${DB_AVANPOST_USER:?set DB_AVANPOST_USER in .env}
      DB_AVANPOST_PASSWORD: ${DB_AVANPOST_PASSWORD:?set DB_AVANPOST_PASSWORD in .env}
      DB_AVANPOST_HOST: ${DB_AVANPOST_HOST}
      DB_AVANPOST_PORT: ${DB_AVANPOST_PORT}
      DB_AVANPOST_DRIVER: ${DB_AVANPOST_DRIVER}
      DB_AVANPOST_POOL_SIZE: ${DB_AVANPOST_POOL_SIZE}
      DB_AVANPOST_MAX_OVERFLOW: ${DB_AVANPOST_MAX_OVERFLOW}
      DB_AVANPOST_ECHO: ${DB_AVANPOST_ECHO}

      # ---------- SQL Server (Teamdroid / Avanpost procedures) ----------
      TEAMDROID_SQL_SERVER: ${TEAMDROID_SQL_SERVER}
      TEAMDROID_SQL_DATABASE: ${TEAMDROID_SQL_DATABASE}
      TEAMDROID_SQL_USERNAME: ${TEAMDROID_SQL_USERNAME}
      TEAMDROID_SQL_PASSWORD: ${TEAMDROID_SQL_PASSWORD}
      TEAMDROID_SQL_TIMEOUT: ${TEAMDROID_SQL_TIMEOUT}

      TEAMDROID_SQL_PROC_AUTH_START: ${TEAMDROID_SQL_PROC_AUTH_START}
      TEAMDROID_SQL_PROC_AUTH_LOGIN: ${TEAMDROID_SQL_PROC_AUTH_LOGIN}
      TEAMDROID_SQL_PROC_TOKEN_VERIFY: ${TEAMDROID_SQL_PROC_TOKEN_VERIFY}
      TEAMDROID_SQL_PROC_TOKEN_FINISH: ${TEAMDROID_SQL_PROC_TOKEN_FINISH}
      TEAMDROID_SQL_PROC_TOKEN_DEVICES_LOAD: ${TEAMDROID_SQL_PROC_TOKEN_DEVICES_LOAD}
      TEAMDROID_SQL_PROC_EDIT_MSG_STATUS_DELIVERY: ${TEAMDROID_SQL_PROC_EDIT_MSG_STATUS_DELIVERY}
      TEAMDROID_SQL_PROC_APP_UPDATE_CHECK: ${TEAMDROID_SQL_PROC_APP_UPDATE_CHECK}
      TEAMDROID_SQL_PROC_APP_UPDATE_OFFERED: ${TEAMDROID_SQL_PROC_APP_UPDATE_OFFERED}
      TEAMDROID_SQL_PROC_APP_UPDATE_CHECK_ALL: ${TEAMDROID_SQL_PROC_APP_UPDATE_CHECK_ALL}
      TEAMDROID_SQL_PROC_SYNC_BASE_LOAD: ${TEAMDROID_SQL_PROC_SYNC_BASE_LOAD}
      TEAMDROID_SQL_PROC_SYNC_BASE_EDIT: ${TEAMDROID_SQL_PROC_SYNC_BASE_EDIT}
      TEAMDROID_SQL_PROC_NOTIFIES_LOAD: ${TEAMDROID_SQL_PROC_NOTIFIES_LOAD}
      TEAMDROID_SQL_PROC_NOTIFIES_SEND: ${TEAMDROID_SQL_PROC_NOTIFIES_SEND}
      TEAMDROID_SQL_PROC_FILES_LOAD: ${TEAMDROID_SQL_PROC_FILES_LOAD}
      TEAMDROID_SQL_PROC_MSG_SEND: ${TEAMDROID_SQL_PROC_MSG_SEND}
      UPLOAD_CHUNK_SIZE: ${UPLOAD_CHUNK_SIZE}
      UPLOAD_MIN_CHUNK_SIZE: ${UPLOAD_MIN_CHUNK_SIZE}
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE}
      UPLOAD_ALLOWED_EXTENSIONS: ${UPLOAD_ALLOWED_EXTENSIONS}
      UPLOAD_RETENTION_DAYS: ${UPLOAD_RETENTION_DAYS}
      UPLOAD_STORAGE_BACKEND: ${UPLOAD_STORAGE_BACKEND}
      UPLOAD_LOCAL_DIR: ${UPLOAD_LOCAL_DIR}
      UPLOAD_URL_PREFIX: ${UPLOAD_URL_PREFIX}
      UPLOAD_CLEANUP_INTERVAL_SEC: ${UPLOAD_CLEANUP_INTERVAL_SEC}

      # ---------- Teamdroid (gRPC / HTTP upload / AppID) ----------
      TEAMDROID_HOST: ${TEAMDROID_HOST}
      TEAMDROID_HTTP_UPLOAD_URL: ${TEAMDROID_HTTP_UPLOAD_URL}
      TEAMDROID_API_KEY: ${TEAMDROID_API_KEY}
      TEAMDROID_USERNAME: ${TEAMDROID_USERNAME}
      TEAMDROID_PASSWORD: ${TEAMDROID_PASSWORD}
      TEAMDROID_APP_ID: ${TEAMDROID_APP_ID}
      TEAMDROID_GRPC_MAX_MESSAGE: ${TEAMDROID_GRPC_MAX_MESSAGE}
      TEAMDROID_CTRL_TIMEOUT: ${TEAMDROID_CTRL_TIMEOUT}

      # ---------- Avanpost Sync ----------
      AVANPOST_AUTO_ADD_USERS_ALL_ON_START: ${AVANPOST_AUTO_ADD_USERS_ALL_ON_START}
      AVANPOST_AUTO_ADD_USERS_IDS_ON_START: ${AVANPOST_AUTO_ADD_USERS_IDS_ON_START}
      AVANPOST_AUTO_SYNC_ON_START: ${AVANPOST_AUTO_SYNC_ON_START}
      AVANPOST_AUTO_ADD_VEHICLES_ON_START: ${AVANPOST_AUTO_ADD_VEHICLES_ON_START}
      AVANPOST_SYNC_FORCE: ${AVANPOST_SYNC_FORCE}
      AVANPOST_SYNC_ASYNC: ${AVANPOST_SYNC_ASYNC}
      AVANPOST_SYNC_USERS_BASE: ${AVANPOST_SYNC_USERS_BASE}
      AVANPOST_SYNC_USERS_DETAILS: ${AVANPOST_SYNC_USERS_DETAILS}
      AVANPOST_SYNC_USERS_DETAILS_IDS: ${AVANPOST_SYNC_USERS_DETAILS_IDS}
      AVANPOST_SYNC_USER_IDS: ${AVANPOST_SYNC_USER_IDS}
      AVANPOST_SYNC_REQUIRED: ${AVANPOST_SYNC_REQUIRED}
      AVANPOST_SYNC_TIMEOUT: ${AVANPOST_SYNC_TIMEOUT}
      AVANPOST_SYNC_CHUNK_SIZE: ${AVANPOST_SYNC_CHUNK_SIZE}

      # ---------- Telegram ----------
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      BOT_ID: ${BOT_ID:?set BOT_ID in .env}
      BOT_HASH: ${BOT_HASH:?set BOT_HASH in .env}
      BOT_SESSION_NAME: ${BOT_SESSION_NAME}
      BOT_USERNAME: ${BOT_USERNAME:?set BOT_USERNAME in .env}
      TELEGRAM_ACCOUNT_TYPE: ${TELEGRAM_ACCOUNT_TYPE}
      USER_PHONE: ${USER_PHONE}
      USER_SESSION_NAME: ${USER_SESSION_NAME}

      # ---------- WS Notify + Relay + FCM ----------
      WS_NOTIFY_ENABLED: ${WS_NOTIFY_ENABLED}
      WS_NOTIFY_PATH: ${WS_NOTIFY_PATH}
      WS_NOTIFY_TOKEN_VERIFY_MODE: ${WS_NOTIFY_TOKEN_VERIFY_MODE}
      WS_NOTIFY_TOKEN_CACHE_TTL: ${WS_NOTIFY_TOKEN_CACHE_TTL}
      WS_NOTIFY_MAX_CONNECTIONS_PER_USER: ${WS_NOTIFY_MAX_CONNECTIONS_PER_USER}
      WS_NOTIFY_HEARTBEAT_INTERVAL: ${WS_NOTIFY_HEARTBEAT_INTERVAL}
      WS_NOTIFY_SEND_TIMEOUT: ${WS_NOTIFY_SEND_TIMEOUT}

      WS_RELAY_AUTH_TOKEN: ${WS_RELAY_AUTH_TOKEN:?set WS_RELAY_AUTH_TOKEN in .env}
      WS_RELAY_INGEST_PATH: ${WS_RELAY_INGEST_PATH}
      WS_TOKEN_KEY_B64: ${WS_TOKEN_KEY_B64}

      FCM_ENABLED: ${FCM_ENABLED}
      FCM_LOAD_FIDS_ON_START: ${FCM_LOAD_FIDS_ON_START}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH}
      FCM_SEND_MODE: ${FCM_SEND_MODE}
      FCM_FID_TTL_SECONDS: ${FCM_FID_TTL_SECONDS}

      # ---------- Mobile apps: ingest-ключи ----------
      APP_SERVER_SYNC_INGEST_API_KEYS: ${APP_SERVER_SYNC_INGEST_API_KEYS}
      APP_CLIENT_SYNC_INGEST_API_KEYS: ${APP_CLIENT_SYNC_INGEST_API_KEYS}
      APP_CLIENT_SUPPORT_INGEST_API_KEYS: ${APP_CLIENT_SUPPORT_INGEST_API_KEYS}

      APP_CLIENT_FILE_LINK_SECRET: ${APP_CLIENT_FILE_LINK_SECRET}

      APP_CLIENT_ERROR_DEVICE_NOT_REGISTERED: ${APP_CLIENT_ERROR_DEVICE_NOT_REGISTERED}

      APP_CLIENT_SYNC_BASE_DEFAULT_LIMIT: ${APP_CLIENT_SYNC_BASE_DEFAULT_LIMIT}
      APP_CLIENT_SYNC_BASE_MAX_LIMIT: ${APP_CLIENT_SYNC_BASE_MAX_LIMIT}
      APP_CLIENT_SYNC_BASE_LOAD_TIMEOUT_SEC: ${APP_CLIENT_SYNC_BASE_LOAD_TIMEOUT_SEC}
      APP_CLIENT_SYNC_BASE_EDIT_TIMEOUT_SEC: ${APP_CLIENT_SYNC_BASE_EDIT_TIMEOUT_SEC}
      APP_CLIENT_SYNC_BASE_REGISTRY_TTL_SEC: ${APP_CLIENT_SYNC_BASE_REGISTRY_TTL_SEC}
      APP_CLIENT_SYNC_BASE_REGISTRY_MAX_ITERATIONS: ${APP_CLIENT_SYNC_BASE_REGISTRY_MAX_ITERATIONS}
      APP_CLIENT_SYNC_BASE_REGISTRY_ITERATIONS_STALE_SEC: ${APP_CLIENT_SYNC_BASE_REGISTRY_ITERATIONS_STALE_SEC}
      APP_CLIENT_SYNC_BASE_REGISTRY_MAX_PACKETS_PER_USER: ${APP_CLIENT_SYNC_BASE_REGISTRY_MAX_PACKETS_PER_USER}
      APP_CLIENT_SYNC_BASE_MAX_RECORD_BYTES: ${APP_CLIENT_SYNC_BASE_MAX_RECORD_BYTES}
      APP_CLIENT_SYNC_BASE_MAX_EDIT_ITEMS: ${APP_CLIENT_SYNC_BASE_MAX_EDIT_ITEMS}
      APP_CLIENT_MAX_FIDS_PER_USER: ${APP_CLIENT_MAX_FIDS_PER_USER}

      # ---------- Diagnostics logs ingest (лимиты) ----------
      APP_CLIENT_SUPPORT_LOGS_INGEST_ENABLED: ${APP_CLIENT_SUPPORT_LOGS_INGEST_ENABLED}
      APP_CLIENT_SUPPORT_LOGS_MAX_BATCH_BYTES: ${APP_CLIENT_SUPPORT_LOGS_MAX_BATCH_BYTES}
      APP_CLIENT_SUPPORT_LOGS_MAX_BATCH_UNCOMPRESSED_BYTES: ${APP_CLIENT_SUPPORT_LOGS_MAX_BATCH_UNCOMPRESSED_BYTES}
      APP_CLIENT_SUPPORT_LOGS_MAX_RECORDS_PER_BATCH: ${APP_CLIENT_SUPPORT_LOGS_MAX_RECORDS_PER_BATCH}
      APP_CLIENT_SUPPORT_LOGS_MAX_MSG_LEN: ${APP_CLIENT_SUPPORT_LOGS_MAX_MSG_LEN}
      APP_CLIENT_SUPPORT_LOGS_MAX_TRACE_LEN: ${APP_CLIENT_SUPPORT_LOGS_MAX_TRACE_LEN}
      APP_CLIENT_SUPPORT_LOGS_MAX_FIELDS_LEN: ${APP_CLIENT_SUPPORT_LOGS_MAX_FIELDS_LEN}
      APP_CLIENT_SUPPORT_LOGS_REQUESTS_PER_DAY: ${APP_CLIENT_SUPPORT_LOGS_REQUESTS_PER_DAY}
      APP_CLIENT_SUPPORT_LOGS_FORCE_ALL_PER_DAY: ${APP_CLIENT_SUPPORT_LOGS_FORCE_ALL_PER_DAY}
      APP_CLIENT_SUPPORT_LOGS_BYTES_PER_DAY: ${APP_CLIENT_SUPPORT_LOGS_BYTES_PER_DAY}
      APP_CLIENT_SUPPORT_LOGS_REQUEST_TTL_SEC: ${APP_CLIENT_SUPPORT_LOGS_REQUEST_TTL_SEC}
      APP_CLIENT_SUPPORT_LOGS_REQUEST_FORCE_ALL_MAX_BYTES: ${APP_CLIENT_SUPPORT_LOGS_REQUEST_FORCE_ALL_MAX_BYTES}
      APP_CLIENT_SUPPORT_LOGS_RETENTION_INFO_DAYS: ${APP_CLIENT_SUPPORT_LOGS_RETENTION_INFO_DAYS}
      APP_CLIENT_SUPPORT_LOGS_RETENTION_ERROR_DAYS: ${APP_CLIENT_SUPPORT_LOGS_RETENTION_ERROR_DAYS}
      APP_CLIENT_SUPPORT_LOGS_REQUESTS_RETENTION_DAYS: ${APP_CLIENT_SUPPORT_LOGS_REQUESTS_RETENTION_DAYS}
      APP_CLIENT_SUPPORT_LOGS_PUSH_TYPE: ${APP_CLIENT_SUPPORT_LOGS_PUSH_TYPE}

      APP_UPDATE_APK_DIR: ${APP_UPDATE_APK_DIR}
      APP_UPDATE_PUBLIC_DIR: ${APP_UPDATE_PUBLIC_DIR}
      APP_UPDATE_PUBLIC_URL: ${APP_UPDATE_PUBLIC_URL}
      APP_UPDATE_POLLING_ENABLED: ${APP_UPDATE_POLLING_ENABLED}
      APP_UPDATE_CHECK_INTERVAL_SEC: ${APP_UPDATE_CHECK_INTERVAL_SEC}
      APP_UPDATE_NOTIFY_COOLDOWN_SEC: ${APP_UPDATE_NOTIFY_COOLDOWN_SEC}

      # ---------- API ----------
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      API_KEYS: ${API_KEYS}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      API_RELOAD: ${API_RELOAD}
      API_WORKERS: ${API_WORKERS}
      API_TRUSTED_HOSTS: ${API_TRUSTED_HOSTS}

      # ---------- Logging ----------
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_DIR: ${LOG_DIR}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT}

      # ---------- Bot / Admin / Support ----------
      ADMIN_IDS: ${ADMIN_IDS:?set ADMIN_IDS in .env}
      SYNC_INTERVAL: ${SYNC_INTERVAL}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH}
      SUPPORT_CHAT_ID: ${SUPPORT_CHAT_ID:?set SUPPORT_CHAT_ID in .env}
      SUPPORT_CHAT_TOPIC_IDS: ${SUPPORT_CHAT_TOPIC_IDS:?set SUPPORT_CHAT_TOPIC_IDS in .env}

      # ---------- Encryption ----------
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?set ENCRYPTION_SECRET in .env}

      # ---------- Rate limiting ----------
      API_RATE_LIMIT: ${API_RATE_LIMIT}
      API_RATE_PERIOD: ${API_RATE_PERIOD}
      BOT_RATE_LIMIT: ${BOT_RATE_LIMIT}
      BOT_COMMAND_LIMIT: ${BOT_COMMAND_LIMIT}
      BOT_RATE_PERIOD: ${BOT_RATE_PERIOD}
      BOT_COMMAND_PERIOD: ${BOT_COMMAND_PERIOD}

      # ---------- Message lifetime / reminders / automation ----------
      MESSAGE_LIFETIME_CHECK_INTERVAL: ${MESSAGE_LIFETIME_CHECK_INTERVAL}
      MESSAGE_LIFETIME_BATCH_SIZE: ${MESSAGE_LIFETIME_BATCH_SIZE}
      MESSAGE_LIFETIME_DEFAULT_SECONDS: ${MESSAGE_LIFETIME_DEFAULT_SECONDS}

      REMINDER_CHECK_INTERVAL: ${REMINDER_CHECK_INTERVAL}
      REMINDER_BATCH_SIZE: ${REMINDER_BATCH_SIZE}
      REMINDER_MAX_PER_USER: ${REMINDER_MAX_PER_USER}
      REMINDER_DEFAULT_INTERVAL: ${REMINDER_DEFAULT_INTERVAL}
      REMINDER_MAX_REMIND_COUNT: ${REMINDER_MAX_REMIND_COUNT}

      AUTOMATION_CONVERSION_METHOD: ${AUTOMATION_CONVERSION_METHOD}
      AUTOMATION_MAX_FILE_SIZE: ${AUTOMATION_MAX_FILE_SIZE}
      AUTOMATION_TEMP_DIR: ${AUTOMATION_TEMP_DIR}
      AUTOMATION_RETRY_COUNT: ${AUTOMATION_RETRY_COUNT}
      AUTOMATION_RETRY_DELAY: ${AUTOMATION_RETRY_DELAY}
      AUTOMATION_CLEANUP_AFTER: ${AUTOMATION_CLEANUP_AFTER}
      AUTOMATION_ALLOWED_EXTENSIONS: ${AUTOMATION_ALLOWED_EXTENSIONS}
      AUTOMATION_MAX_REQUESTS_PER_USER: ${AUTOMATION_MAX_REQUESTS_PER_USER}
      AUTOMATION_REQUIRE_ADMIN_APPROVAL: ${AUTOMATION_REQUIRE_ADMIN_APPROVAL}
      AUTOMATION_NOTIFICATION_CHAT_IDS: ${AUTOMATION_NOTIFICATION_CHAT_IDS}
      AUTOMATION_AUTO_CLEANUP: ${AUTOMATION_AUTO_CLEANUP}
      AUTOMATION_CONVERSION_TIMEOUT: ${AUTOMATION_CONVERSION_TIMEOUT}
      AUTOMATION_STATS_ENABLED: ${AUTOMATION_STATS_ENABLED}
      AUTOMATION_STATS_MAX_ENTRIES: ${AUTOMATION_STATS_MAX_ENTRIES}

      # ---------- Error handling / log error notifications ----------
      ERROR_GROUPING_ENABLED: ${ERROR_GROUPING_ENABLED}
      ERROR_GROUPING_WINDOW_MINUTES: ${ERROR_GROUPING_WINDOW_MINUTES}
      ERROR_MAX_OCCURRENCES_BEFORE_SILENCE: ${ERROR_MAX_OCCURRENCES_BEFORE_SILENCE}
      ERROR_GROUP_CACHE_TTL_SECONDS: ${ERROR_GROUP_CACHE_TTL_SECONDS}

      LOG_ERROR_NOTIFICATION_INTERVAL: ${LOG_ERROR_NOTIFICATION_INTERVAL}
      LOG_ERROR_AUTO_CAPTURE: ${LOG_ERROR_AUTO_CAPTURE}
      LOG_ERROR_MAX_MESSAGE_LENGTH: ${LOG_ERROR_MAX_MESSAGE_LENGTH}
      LOG_ERROR_MAX_TRACEBACK_LENGTH: ${LOG_ERROR_MAX_TRACEBACK_LENGTH}
      LOG_ERROR_GROUPING_ENABLED: ${LOG_ERROR_GROUPING_ENABLED}
      LOG_ERROR_CLEAR_CACHE_ON_START: ${LOG_ERROR_CLEAR_CACHE_ON_START}
      LOG_ERROR_MESSAGE_LIFETIME_SECONDS: ${LOG_ERROR_MESSAGE_LIFETIME_SECONDS}
      LOG_QUEUE_MAX_SIZE: ${LOG_QUEUE_MAX_SIZE}
      LOG_WORKER_TIMEOUT: ${LOG_WORKER_TIMEOUT}

      # ---------- Telegram clients / keyboard / auth / http / api defaults ----------
      TELEGRAM_API_RETRY: ${TELEGRAM_API_RETRY}
      TELEGRAM_RECONNECT_DELAY: ${TELEGRAM_RECONNECT_DELAY}
      TELEGRAM_CATCH_UP_ON_START: ${TELEGRAM_CATCH_UP_ON_START}
      TELEGRAM_SYNC_CHATS_ON_START: ${TELEGRAM_SYNC_CHATS_ON_START}
      TELEGRAM_POLLING_TIMEOUT: ${TELEGRAM_POLLING_TIMEOUT}
      TELEGRAM_RETRY_DELAY: ${TELEGRAM_RETRY_DELAY}
      TELEGRAM_MAX_RETRIES: ${TELEGRAM_MAX_RETRIES}
      SYNC_CACHE_TTL_SECONDS: ${SYNC_CACHE_TTL_SECONDS}

      KEYBOARD_BUTTONS_PER_ROW: ${KEYBOARD_BUTTONS_PER_ROW}
      AUTH_CACHE_TTL_SECONDS: ${AUTH_CACHE_TTL_SECONDS}
      HTTP_TIMEOUT_KEEP_ALIVE: ${HTTP_TIMEOUT_KEEP_ALIVE}
      API_DEFAULT_PAGE_SIZE: ${API_DEFAULT_PAGE_SIZE}
      API_STATS_DAYS: ${API_STATS_DAYS}

      # ---------- Notifications defaults / bot messages ----------
      DEFAULT_NOTIFICATION_LEVEL: ${DEFAULT_NOTIFICATION_LEVEL}
      DEFAULT_GROUPING_WINDOW: ${DEFAULT_GROUPING_WINDOW}
      DEFAULT_AUTO_REPORT_INTERVAL: ${DEFAULT_AUTO_REPORT_INTERVAL}
      DEFAULT_WORK_HOURS_START: ${DEFAULT_WORK_HOURS_START}
      DEFAULT_WORK_HOURS_END: ${DEFAULT_WORK_HOURS_END}
      BOT_MESSAGE_LIFETIME_SECONDS: ${BOT_MESSAGE_LIFETIME_SECONDS}

      # ---------- Alembic / migrations ----------
      ALEMBIC_CONFIG: ${ALEMBIC_CONFIG}
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS}
      MIGRATIONS_REQUIRED: ${MIGRATIONS_REQUIRED}
      MIGRATION_RETRIES: ${MIGRATION_RETRIES}
      DB_WAIT_ATTEMPTS: ${DB_WAIT_ATTEMPTS}
      RUN_SEED: ${RUN_SEED}
      CHECK_MIGRATIONS: ${CHECK_MIGRATIONS}

    volumes:
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./docker/app/config:/app/config:ro
      - ./migrations:/app/migrations:ro
      - ./alembic.ini:/app/alembic.ini:ro
      # Загрузки мобильного клиента (POST /api/v1/client/uploads → PATCH → complete → msgs).
      # Bind-mount, чтобы файлы переживали рестарт контейнера и были видны с хоста.
      - ./data/uploads:/app/data/uploads
      # ЗАКРЫТАЯ папка: APK только через settings.API_KEY_HEADER (GET /api/v1/update/apk/...)
      - ./update/apk:/app/update/apk:ro
      # ОТКРЫТАЯ папка: последняя версия APK, раздаётся nginx'ом без ключа
      - ./update/public:/app/update/public:ro
    ports:
      # ВАЖНО: 8000 опубликован НАПРЯМУЮ. Мобильный клиент
      # качает APK по https://<host>:8000/api/v1/update/public/...
      # в обход nginx. Range-обработка живёт в
      # app/api/routers/update.py — см. docstring модуля.
      # Сервис nginx (профиль production) /api/v1/update/*
      # не проксирует.-
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - teambot_network
    command: ["--mode", "${APP_MODE}"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ============ Сервис миграций (только явно, профиль migration) ============
  app-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: teambot:latest
    container_name: teambot_migrate
    restart: "no"
    profiles:
      - migration
    environment:
      DB_MAIN_NAME: ${DB_MAIN_NAME}
      DB_MAIN_USER: ${DB_MAIN_USER:?set DB_MAIN_USER in .env}
      DB_MAIN_PASSWORD: ${DB_MAIN_PASSWORD:?set DB_MAIN_PASSWORD in .env}
      DB_MAIN_HOST: ${DB_MAIN_HOST}
      DB_MAIN_PORT: ${DB_MAIN_PORT}

      DB_AVANPOST_NAME: ${DB_AVANPOST_NAME}
      DB_AVANPOST_USER: ${DB_AVANPOST_USER:?set DB_AVANPOST_USER in .env}
      DB_AVANPOST_PASSWORD: ${DB_AVANPOST_PASSWORD:?set DB_AVANPOST_PASSWORD in .env}
      DB_AVANPOST_HOST: ${DB_AVANPOST_HOST}
      DB_AVANPOST_PORT: ${DB_AVANPOST_PORT}
      DB_AVANPOST_DRIVER: ${DB_AVANPOST_DRIVER}

      TEAMDROID_SQL_SERVER: ${TEAMDROID_SQL_SERVER}
      TEAMDROID_SQL_DATABASE: ${TEAMDROID_SQL_DATABASE}
      TEAMDROID_SQL_USERNAME: ${TEAMDROID_SQL_USERNAME}
      TEAMDROID_SQL_PASSWORD: ${TEAMDROID_SQL_PASSWORD}
      TEAMDROID_SQL_TIMEOUT: ${TEAMDROID_SQL_TIMEOUT}
      TEAMDROID_SQL_PROC_AUTH_START: ${TEAMDROID_SQL_PROC_AUTH_START}
      TEAMDROID_SQL_PROC_AUTH_LOGIN: ${TEAMDROID_SQL_PROC_AUTH_LOGIN}
      TEAMDROID_SQL_PROC_TOKEN_VERIFY: ${TEAMDROID_SQL_PROC_TOKEN_VERIFY}
      TEAMDROID_SQL_PROC_TOKEN_FINISH: ${TEAMDROID_SQL_PROC_TOKEN_FINISH}
      TEAMDROID_SQL_PROC_TOKEN_DEVICES_LOAD: ${TEAMDROID_SQL_PROC_TOKEN_DEVICES_LOAD}
      TEAMDROID_SQL_PROC_EDIT_MSG_STATUS_DELIVERY: ${TEAMDROID_SQL_PROC_EDIT_MSG_STATUS_DELIVERY}
      TEAMDROID_SQL_PROC_APP_UPDATE_CHECK: ${TEAMDROID_SQL_PROC_APP_UPDATE_CHECK}
      TEAMDROID_SQL_PROC_APP_UPDATE_OFFERED: ${TEAMDROID_SQL_PROC_APP_UPDATE_OFFERED}
      TEAMDROID_SQL_PROC_APP_UPDATE_CHECK_ALL: ${TEAMDROID_SQL_PROC_APP_UPDATE_CHECK_ALL}
      TEAMDROID_SQL_PROC_SYNC_BASE_LOAD: ${TEAMDROID_SQL_PROC_SYNC_BASE_LOAD}
      TEAMDROID_SQL_PROC_SYNC_BASE_EDIT: ${TEAMDROID_SQL_PROC_SYNC_BASE_EDIT}
      TEAMDROID_SQL_PROC_NOTIFIES_LOAD: ${TEAMDROID_SQL_PROC_NOTIFIES_LOAD}
      TEAMDROID_SQL_PROC_NOTIFIES_SEND: ${TEAMDROID_SQL_PROC_NOTIFIES_SEND}
      TEAMDROID_SQL_PROC_FILES_LOAD: ${TEAMDROID_SQL_PROC_FILES_LOAD}
      TEAMDROID_SQL_PROC_MSG_SEND: ${TEAMDROID_SQL_PROC_MSG_SEND}
      UPLOAD_CHUNK_SIZE: ${UPLOAD_CHUNK_SIZE}
      UPLOAD_MIN_CHUNK_SIZE: ${UPLOAD_MIN_CHUNK_SIZE}
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE}
      UPLOAD_ALLOWED_EXTENSIONS: ${UPLOAD_ALLOWED_EXTENSIONS}
      UPLOAD_RETENTION_DAYS: ${UPLOAD_RETENTION_DAYS}
      UPLOAD_STORAGE_BACKEND: ${UPLOAD_STORAGE_BACKEND}
      UPLOAD_LOCAL_DIR: ${UPLOAD_LOCAL_DIR}
      UPLOAD_URL_PREFIX: ${UPLOAD_URL_PREFIX}
      UPLOAD_CLEANUP_INTERVAL_SEC: ${UPLOAD_CLEANUP_INTERVAL_SEC}

      TEAMDROID_APP_ID: ${TEAMDROID_APP_ID}

      BOT_TOKEN: ${BOT_TOKEN}
      BOT_ID: ${BOT_ID}
      BOT_HASH: ${BOT_HASH}
      BOT_USERNAME: ${BOT_USERNAME}
      TELEGRAM_ACCOUNT_TYPE: ${TELEGRAM_ACCOUNT_TYPE}
