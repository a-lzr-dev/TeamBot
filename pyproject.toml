# ============================================================
# TeamBot — pyproject.toml
# ============================================================
# Менеджер зависимостей: uv (рекомендуется) или pip
# Python: 3.12+
#
# Команды:
#   uv lock
#   uv sync
#   uv sync --group dev
#   uv export --format requirements.txt --no-dev --no-emit-project --output-file requirements.txt
#   uv export --format requirements.txt --group dev --no-emit-project --output-file requirements-dev.txt
# ============================================================

[project]
name = "teambot"
version = "0.1.0"
description = "TeamBot — корпоративный Telegram-бот для интеграции с Avanpost"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "TeamBot Team" }]
keywords = ["telegram", "bot", "avanpost", "aiogram", "telethon", "fastapi"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
]

# ============================================================
# RUNTIME DEPENDENCIES
# ============================================================
dependencies = [
    # ---------- Telegram ----------
    "aiogram>=3.30.0",
    "telethon>=1.44.0",
    "pyaes>=1.6.1",                       # шифрование MTProto (telethon)
    # ---------- Web / API ----------
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "websockets>=12.0",
    "starlette>=1.3.1",
    "python-multipart>=0.0.32",
    # ---------- Конфигурация / валидация ----------
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    # ---------- Базы данных ----------
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",                    # PostgreSQL (async)
    "psycopg2-binary>=2.9.12",            # PostgreSQL (sync, для Alembic)
    "aioodbc>=0.5.0",                     # MSSQL (async)
    "pyodbc>=5.3.0",                      # MSSQL (sync, драйвер)
    "alembic>=1.19.1",
    # ---------- gRPC / Protobuf (runtime) ----------
    # ВАЖНО: grpcio>=1.84.0 требуется сгенерированным app/model_pb2_grpc.py
    "grpcio>=1.84.0",
    "protobuf>=7.35.1",
    "tinode_grpc>=0.22.3,<0.23",
    # ---------- HTTP ----------
    "requests>=2.34.2",                   # используется в app/api/routers/teamdroid.py
    "urllib3>=1.26",
    "httpx>=0.27.0",                      # async HTTP + TestClient
    # ---------- Криптография ----------
    "cryptography>=50.0.0",
    "bcrypt>=5.0.0",
    # ---------- Утилиты ----------
    "aiofiles>=25.1.0",
]

# ============================================================
# WINDOWS-ONLY DEPENDENCIES (конвертация DOC → PDF)
# ============================================================
# Устанавливаются только на Windows: uv sync --extra windows
# На Linux/macOS используется LibreOffice (soffice), устанавливается в Dockerfile.
[project.optional-dependencies]
windows = [
    "pywin32>=312; sys_platform == 'win32'",
    "comtypes>=1.4.16; sys_platform == 'win32'",
]

# ============================================================
# DEV DEPENDENCIES (только для разработки и CI)
# ============================================================
[dependency-groups]
dev = [
    # ---------- Тестирование ----------
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "freezegun>=1.4.0",
    "coverage>=7.15.4",

    # ---------- Качество кода ----------
    "mypy>=2.3.1",
    "ruff>=0.16.2",
    "pre-commit>=4.6.1",

    # ---------- Тестовая БД ----------
    "aiosqlite>=0.19.0",

    # ---------- Генерация protobuf/gRPC ----------
    # Нужен только для пересборки app/model_pb2*.py из model.proto
    "grpcio-tools>=1.84.0",

    "types-requests>=2.32",
]

# ============================================================
# PYTEST
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short --maxfail=5"
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (require database)",
    "e2e: End-to-end tests (full system)",
    "slow: Slow running tests",
    "db: Tests that require database connection",
    "api: Tests for API endpoints",
    "bot: Tests for Telegram bot",
    "service: Tests for services",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:.*pkg_resources.*:DeprecationWarning",
]

# ============================================================
# COVERAGE
# ============================================================
[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "scripts/*",
    "app/locales/data/*",
    "app/__init__.py",
    "app/main.py",
    "app/model_pb2.py",
    "app/model_pb2_grpc.py",
    "app/bot/handlers/aiogram/lists/*",
    "app/bot/handlers/aiogram/custom/*",
    "app/bot/handlers/aiogram/details/*",
    "app/bot/keyboards/*",
    "app/bot/callbacks/*",
]
branch = true
parallel = true
concurrency = ["thread", "gevent"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "return None  # pragma: no cover",
    "pass",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise RuntimeError",
]
show_missing = true
precision = 2
skip_covered = false
skip_empty = false

[tool.coverage.html]
directory = "htmlcov"
title = "TeamBot Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

# ============================================================
# RUFF
# ============================================================
[tool.ruff]
line-length = 120
target-version = "py312"          # согласовано с requires-python
extend-exclude = [
    "migrations/versions/*",
    "app/model_pb2.py",
    "app/model_pb2_grpc.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "B008",     # do not perform function calls in argument defaults (FastAPI Depends)
    "E501",     # line too long (управляется line-length)
    "SIM300",   # yoda conditions
    "SIM108",   # ternary operator вместо if/else
    "SIM103",   # return условия напрямую
    "SIM105",   # contextlib.suppress вместо try/except/pass
    "SIM117",   # объединение вложенных with
    "UP038",    # isinstance(X | Y) — конфликтует с ruff-format
]
[tool.ruff.lint.per-file-ignores]
"app/db/**/*.py" = ["TC001", "TC002", "TC003", "TC004", "TC005"]
"app/models/**/*.py" = ["TC001", "TC002", "TC003", "TC004", "TC005"]
"app/ws/**/*.py" = ["TC001", "TC002", "TC003", "TC004", "TC005"]
"scripts/**/*.py" = ["E402"]
"migrations/**/*.py" = ["E402", "F401", "I001"]
"tests/**/*.py" = [
    "S101",
    "B011",
    "B018",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ============================================================
# MYPY
# ============================================================
[tool.mypy]
python_version = "3.12"           # согласовано с requires-python и ruff
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = false
exclude = [
    "^migrations/versions/",
    "^app/model_pb2\\.py$",
    "^app/model_pb2_grpc\\.py$",
]

# ---------- Пакеты без стабов ----------
[[tool.mypy.overrides]]
module = [
    "pythoncom",
    "win32com",
    "win32com.client",
    "comtypes",
    "comtypes.client",
    "telethon",
    "telethon.errors",
    "telethon.events",
    "telethon.events.common",
    "telethon.tl.types",
    "telethon.tl.functions.channels",
    "telethon.tl.functions.messages",
    "pyodbc",
    "aioodbc",
    "grpc",
    "model_pb2",
    "model_pb2_grpc",
]
ignore_missing_imports = true

# ---------- Тесты ----------
[[tool.mypy.overrides]]
module = [
    "tests.*",
    "pytest",
    "pytest_asyncio",
    "pytest_cov",
    "pytest_mock",
    "freezegun",
    "aiosqlite",
    "httpx",
]
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false

# ============================================================
# ALEMBIC
# ============================================================
[tool.alembic]
config = "alembic.ini"

# ============================================================
# UV
# ============================================================
[tool.uv]
# Индекс пакетов (при необходимости корпоративного зеркала — раскомментируйте)
# index-url = "https://pypi.org/simple"

# Использовать только lock-файл, не разрешать обновления
# frozen = true

# Собирать в editable-режиме
# editable = true

# ============================================================
# COMMITIZEN / BUMPVERSION
# ============================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true

[tool.bumpversion]
current_version = "0.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Release {new_version}"
allow_dirty = false
commit = true
message = "bump: version {current_version} -> {new_version}"
commit_args = ""
