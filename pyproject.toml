[project]
name = "teambot"
version = "0.1.0"
description = "TeamBot"
requires-python = ">=3.14"
dependencies = [
    "aioodbc>=0.5.0",
    "aiogram>=3.30.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "telethon>=1.44.0",
    "uvicorn>=0.52.2",
    "myapplication>=0.1.0",
    "the-new-hotness>=1.4.1",
    "mypy>=2.3.1",
    "bcrypt>=5.0.0",
]

# ========== КОНФИГУРАЦИЯ RUFF ==========
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
]
ignore = [
    "B008",
    "E501",
    "SIM300",
]

[tool.ruff.lint.per-file-ignores]
"app/db/**/*.py" = ["TC001", "TC002", "TC003", "TC004", "TC005"]
"app/models/**/*.py" = ["TC001", "TC002", "TC003", "TC004", "TC005"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ========== КОНФИГУРАЦИЯ MYPY ==========
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "pythoncom",
    "win32com",
    "win32com.client",
    "comtypes",
    "comtypes.client",
    "telethon",
    "telethon.errors",
    "telethon.events",
    "telethon.events.common",
    "telethon.tl.types",
    "telethon.tl.functions.channels",
    "telethon.tl.functions.messages",
]
ignore_missing_imports = true