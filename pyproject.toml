[project]
name = "teambot"
version = "0.1.0"
description = "TeamBot"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.30.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "comtypes>=1.4.16",
    "fastapi>=0.141.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pydevd>=3.5.0",
    "pyodbc>=5.3.0",
    "python-decouple>=3.8",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pywin32>=312",
    "routers>=0.1.3",
    "ruff>=0.16.1",
    "sqlacodegen>=4.0.4",
    "sqlalchemy>=2.0.51",
    "telethon>=1.44.0",
    "the-new-hotness>=1.4.1",
    "uvicorn>=0.52.1",
]

# ========== КОНФИГУРАЦИЯ RUFF ==========
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
]
ignore = [
    "B008",
    "E501",
    "SIM300",
]

[tool.ruff.lint.per-file-ignores]
"app/db/**/*.py" = ["TC001", "TC002", "TC003", "TC004", "TC005"]
"app/models/**/*.py" = ["TC001", "TC002", "TC003", "TC004", "TC005"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ========== КОНФИГУРАЦИЯ MYPY ==========
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "aiogram.*",
    "comtypes.*",
    "pyodbc.*",
    "pywin32.*",
    "routers.*",
    "sqlacodegen.*",
    "telethon.*",
    "the_new_hotness.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "aiosqlite.*",
]
ignore_missing_imports = true