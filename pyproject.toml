[project]
name = "teambot"
version = "0.1.0"
description = "TeamBot"
requires-python = ">=3.14"
dependencies = [
    "aioodbc>=0.5.0",
    "aiogram>=3.30.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "telethon>=1.44.0",
    "uvicorn>=0.52.4",
    "myapplication>=0.1.0",
    "the-new-hotness>=1.4.1",
    "mypy>=2.3.1",
    "bcrypt>=5.0.0",
    "alembic>=1.19.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.27.0",
    "freezegun>=1.4.0",
    "gevent>=26.8.0",
    "coverage>=7.15.4",
]

# ============================================================
# КОНФИГУРАЦИЯ PYTEST
# ============================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short --maxfail=5"
asyncio_mode = "auto"

markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (require database)",
    "e2e: End-to-end tests (full system)",
    "slow: Slow running tests",
    "db: Tests that require database connection",
    "api: Tests for API endpoints",
    "bot: Tests for Telegram bot",
    "service: Tests for services",
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:.*pkg_resources.*:DeprecationWarning",
]

# ============================================================
# КОНФИГУРАЦИЯ COVERAGE
# ============================================================

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "scripts/*",
    "app/locales/data/*",
    "app/__init__.py",
    "app/main.py",
    "app/bot/handlers/aiogram/lists/*",
    "app/bot/handlers/aiogram/custom/*",
    "app/bot/handlers/aiogram/details/*",
    "app/bot/keyboards/*",
    "app/bot/callbacks/*",
]
branch = true
parallel = true
concurrency = ["thread", "gevent"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "return None  # pragma: no cover",
    "pass",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise RuntimeError",
]
show_missing = true
precision = 2
skip_covered = false
skip_empty = false

[tool.coverage.html]
directory = "htmlcov"
title = "TeamBot Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

# ============================================================
# КОНФИГУРАЦИЯ RUFF
# ============================================================

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
]
ignore = [
    "B008",
    "E501",
    "SIM300",
]

[tool.ruff.lint.per-file-ignores]
"app/db/**/*.py" = ["TC001", "TC002", "TC003", "TC004", "TC005"]
"app/models/**/*.py" = ["TC001", "TC002", "TC003", "TC004", "TC005"]
"scripts/**/*.py" = ["E402"]
"tests/**/*.py" = [
    "S101",  # assert используется в тестах
    "B011",  # assert False используется в тестах
    "B018",  # useless-expression в тестах допустимо
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ============================================================
# КОНФИГУРАЦИЯ MYPY
# ============================================================

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "pythoncom",
    "win32com",
    "win32com.client",
    "comtypes",
    "comtypes.client",
    "telethon",
    "telethon.errors",
    "telethon.events",
    "telethon.events.common",
    "telethon.tl.types",
    "telethon.tl.functions.channels",
    "telethon.tl.functions.messages",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "pytest",
    "pytest_asyncio",
    "pytest_cov",
    "pytest_mock",
    "freezegun",
    "aiosqlite",
    "httpx",
]
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false

# ============================================================
# КОНФИГУРАЦИЯ ALEMBIC
# ============================================================

[tool.alembic]
config = "alembic.ini"

# ============================================================
# КОНФИГУРАЦИЯ UV (опционально, если используете uv)
# ============================================================

[tool.uv]
dev-dependencies = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.27.0",
    "freezegun>=1.4.0",
]

# ============================================================
# КОНФИГУРАЦИЯ ДЛЯ ИНСТРУМЕНТОВ РАЗРАБОТКИ
# ============================================================

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true

[tool.bumpversion]
current_version = "0.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = [
    "{major}.{minor}.{patch}",
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Release {new_version}"
allow_dirty = false
commit = true
message = "bump: version {current_version} -> {new_version}"
commit_args = ""
