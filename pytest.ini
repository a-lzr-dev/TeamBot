[pytest]
# Пути для поиска тестов
testpaths = tests

# Файлы с тестами
python_files = test_*.py

# Классы с тестами
python_classes = Test*

# Функции с тестами
python_functions = test_*

# Добавление маркеров
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require database)
    e2e: End-to-end tests (full system)
    slow: Slow running tests
    db: Tests that require database connection
    api: Tests for API endpoints
    bot: Tests for Telegram bot
    service: Tests for services
    auth: Tests for authentication
    automation: Tests for automation features
    sync: Tests for synchronization
    avanpost: Tests for Avanpost integration

# Настройки для asyncio
asyncio_mode = auto

# Переменные окружения для тестов
addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=10
    --cov=app
    --cov-report=term
    --cov-report=html
    --cov-fail-under=30
    --cov-branch

# Исключаемые предупреждения
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*pkg_resources.*:DeprecationWarning

# Исключение покрытия
; coverage exclude lines (можно также добавить в pyproject.toml)
